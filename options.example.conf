# Stack Pilot installer option defaults.
# Copy this file to options.conf before editing it, or let the installer create
# the private copy automatically. Never store passwords in this example file.

timezone=Asia/Shanghai
user=www
group=www

# Base directories. Individual component paths can still be customized below.
services_base_dir=/usr/local/services
data_base_dir=/usr/local/data
runtime_base_dir=/data
pid_dir=/data/pid
sock_dir=/data/sock
logs_dir=/data/logs

nginx_install_dir=/usr/local/services/nginx
php_install_base=/usr/local/services/php
mysql_install_dir=/usr/local/services/mysql
mariadb_install_dir=/usr/local/services/mariadb
redis_install_dir=/usr/local/services/redis
memcached_install_dir=/usr/local/services/memcached
composer_install_dir=/usr/local/services/composer

# Selected component versions. Available choices are maintained in versions.conf.
nginx_ver=1.28.1
mysql_ver=8.4.0
mariadb_ver=10.11.15
redis_ver=8.4.0

mysql_data_dir=/usr/local/data/mysql
mariadb_data_dir=/usr/local/data/mariadb
redis_data_dir=/usr/local/data/redis
memcached_data_dir=/usr/local/data/memcached
wwwroot_dir=/data/www
backup_dir=/data/backup
# Remove backup artifacts older than this many days. 0 disables retention and
# keeps everything, so a defaulted or empty value can never delete all backups.
backup_keep_days=7
# Failed upgrades leave <install_dir>.failed-<timestamp> copies behind. Keep
# this many of the newest for post-mortem; 0 removes all of them.
upgrade_keep_failed=1

nginx_log_dir=/data/logs/nginx
php_log_dir=/data/logs/php
mysql_log_dir=/data/logs/mysql
mariadb_log_dir=/data/logs/mariadb
redis_log_dir=/data/logs/redis
memcached_log_dir=/data/logs/memcached

mysql_sock=/data/sock/mysql.sock
mariadb_sock=/data/sock/mariadb.sock
mysql_pid=/data/pid/mysql.pid
mariadb_pid=/data/pid/mariadb.pid
nginx_pid=/data/pid/nginx.pid

# Empty means generate a random password during installation.
mysql_password=
mariadb_password=
redis_password=
memcached_password=

# Space-separated PHP short versions, for example: "74 84" or "5.6 8.4".
php_versions=84

# Install components: nginx php mysql mariadb redis memcached certbot composer fail2ban.
install_components="nginx php redis certbot composer"

# Database engine: mysql, mariadb, none.
db_engine=mysql
install_redis=y
install_memcached=n
install_composer=y
manage_firewall=n
open_database_port=n
open_redis_port=n
open_memcached_port=n

# Network/runtime tuning.
customize_service_ports=n
nginx_http_port=80
nginx_https_port=443
nginx_worker_connections=10240
nginx_keepalive_timeout=65
# Largest request body Nginx accepts. Left empty it follows php_post_max_size,
# because Nginx returns 413 before PHP is reached and its own default is 1m.
nginx_client_max_body_size=
# Response security headers on every generated virtual host. HSTS is added only
# to HTTPS server blocks; set nginx_hsts_max_age=0 to leave it out.
nginx_security_headers=y
nginx_hsts_max_age=31536000
# HTTP/3 (QUIC). Requires Nginx 1.25.0 or newer and opens UDP on the HTTPS port.
nginx_http3=n
# Per-IP request and connection limits. The shared-memory zones are written into
# the http block at install time, so switching this on afterwards needs a rerun
# of the installer before new sites can use it.
nginx_rate_limit=n
nginx_rate_limit_rps=10
nginx_rate_limit_burst=20
nginx_conn_limit=20
mysql_port=3306
mariadb_port=3306
redis_port=6379
redis_bind=127.0.0.1
redis_appendonly=yes
memcached_port=11211
memcached_bind=127.0.0.1
memcached_memory=128

# PHP-FPM tuning shared by all installed PHP versions.
php_pm=dynamic
php_pm_max_children=20
php_pm_start_servers=4
php_pm_min_spare_servers=2
php_pm_max_spare_servers=8
php_memory_limit=256M
php_upload_max_filesize=50M
php_post_max_size=50M
php_max_execution_time=300

# Log rotation for nginx, PHP-FPM, and the data services. Without it the logs
# under logs_dir grow until they fill the partition.
manage_logrotate=y
logrotate_interval=daily
logrotate_keep=14

# fail2ban jails, used only when fail2ban is in install_components.
fail2ban_bantime=3600
fail2ban_findtime=600
fail2ban_maxretry=5

# PHP install profile: minimal, web, full, custom.
php_profile=web

# Compile/bundled extension switches. The web profile enables common web extensions.
php_extensions="opcache mysqli pdo_mysql mbstring curl openssl gd zip fileinfo exif intl bcmath sockets pcntl bz2 sodium"

# PECL/external extensions aligned with common panel choices such as BT/1Panel.
php_pecl_extensions="redis imagick"
php_security_hardening=y
php_disable_functions=passthru,exec,system,chroot,chgrp,chown,shell_exec,proc_open,proc_get_status,popen,ini_alter,ini_restore,dl,openlog,syslog,readlink,symlink,popepassthru,stream_socket_server
# Optional PHP open_basedir restriction, for example /data/www/:/tmp/
# Left empty the directive is not written at all, so a restriction configured
# elsewhere is preserved; writing an empty open_basedir would clear it.
php_open_basedir=
