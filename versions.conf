# Official source/binary versions and download hosts.

# Curated installable versions. The selected value is persisted in options.conf.
nginx_versions="1.24.0 1.26.3 1.28.1"
mysql_versions="5.7.44 8.0.42 8.4.0"
mariadb_versions="10.6.22 10.11.15 11.4.9"
redis_versions="6.2.19 7.2.10 8.4.0"

# Backward-compatible defaults. options.conf may override these after load_versions.
nginx_ver=${nginx_ver:-1.28.1}
mysql_ver=${mysql_ver:-8.4.0}
mariadb_ver=${mariadb_ver:-10.11.15}
redis_ver=${redis_ver:-8.4.0}

php54_ver=5.4.45
php55_ver=5.5.38
php56_ver=5.6.40
php70_ver=7.0.33
php71_ver=7.1.33
php72_ver=7.2.34
php73_ver=7.3.33
php74_ver=7.4.33
php80_ver=8.0.30
php81_ver=8.1.34
php82_ver=8.2.30
php83_ver=8.3.29
php84_ver=8.4.16
php85_ver=8.5.1

nginx_download_base=https://nginx.org/download
php_download_base=https://www.php.net/distributions
mysql_download_base=https://cdn.mysql.com/Downloads
mariadb_download_base=https://archive.mariadb.org
redis_download_base=https://download.redis.io/releases

component_version_supported() {
  local selected="$1" supported="$2" item
  for item in ${supported}; do
    [[ "${selected}" == "${item}" ]] && return 0
  done
  return 1
}

refresh_component_version_urls() {
  component_version_supported "${nginx_ver}" "${nginx_versions}" || return 1
  component_version_supported "${mysql_ver}" "${mysql_versions}" || return 1
  component_version_supported "${mariadb_ver}" "${mariadb_versions}" || return 1
  component_version_supported "${redis_ver}" "${redis_versions}" || return 1
  nginx_url=${nginx_download_base}/nginx-${nginx_ver}.tar.gz
  redis_url=${redis_download_base}/redis-${redis_ver}.tar.gz
}

refresh_component_version_urls

# Optional SHA256 checksums. Leave empty to skip checksum verification.
nginx_sha256=
redis_sha256=
mysql_sha256=
mariadb_sha256=

php_source_version() {
  case "${1//./}" in
    54) printf '%s' "${php54_ver}" ;;
    55) printf '%s' "${php55_ver}" ;;
    56) printf '%s' "${php56_ver}" ;;
    70) printf '%s' "${php70_ver}" ;;
    71) printf '%s' "${php71_ver}" ;;
    72) printf '%s' "${php72_ver}" ;;
    73) printf '%s' "${php73_ver}" ;;
    74) printf '%s' "${php74_ver}" ;;
    80) printf '%s' "${php80_ver}" ;;
    81) printf '%s' "${php81_ver}" ;;
    82) printf '%s' "${php82_ver}" ;;
    83) printf '%s' "${php83_ver}" ;;
    84) printf '%s' "${php84_ver}" ;;
    85) printf '%s' "${php85_ver}" ;;
    *) return 1 ;;
  esac
}

php_source_url() {
  local full
  full="$(php_source_version "$1")" || return 1
  printf '%s/php-%s.tar.gz' "${php_download_base}" "${full}"
}

php_source_sha256() {
  case "${1//./}" in
    54) printf '%s' "${php54_sha256:-}" ;;
    55) printf '%s' "${php55_sha256:-}" ;;
    56) printf '%s' "${php56_sha256:-}" ;;
    70) printf '%s' "${php70_sha256:-}" ;;
    71) printf '%s' "${php71_sha256:-}" ;;
    72) printf '%s' "${php72_sha256:-}" ;;
    73) printf '%s' "${php73_sha256:-}" ;;
    74) printf '%s' "${php74_sha256:-}" ;;
    80) printf '%s' "${php80_sha256:-}" ;;
    81) printf '%s' "${php81_sha256:-}" ;;
    82) printf '%s' "${php82_sha256:-}" ;;
    83) printf '%s' "${php83_sha256:-}" ;;
    84) printf '%s' "${php84_sha256:-}" ;;
    85) printf '%s' "${php85_sha256:-}" ;;
    *) return 1 ;;
  esac
}

mysql_binary_url() {
  local arch suffix series platform
  arch="$(uname -m)"
  case "${arch}" in
    x86_64|amd64) suffix=x86_64 ;;
    aarch64|arm64) suffix=aarch64 ;;
    *) return 1 ;;
  esac
  series="${mysql_ver%.*}"
  case "${series}" in
    5.7) platform=linux-glibc2.12 ;;
    8.0) platform=linux-glibc2.17 ;;
    8.4) platform=linux-glibc2.28 ;;
    *) return 1 ;;
  esac
  printf '%s/MySQL-%s/mysql-%s-%s-%s.tar.xz' "${mysql_download_base}" "${series}" "${mysql_ver}" "${platform}" "${suffix}"
}

mariadb_binary_url() {
  local arch suffix
  arch="$(uname -m)"
  case "${arch}" in
    x86_64|amd64) suffix=x86_64 ;;
    aarch64|arm64) suffix=aarch64 ;;
    *) return 1 ;;
  esac
  printf '%s/mariadb-%s/bintar-linux-systemd-%s/mariadb-%s-linux-systemd-%s.tar.gz' \
    "${mariadb_download_base}" "${mariadb_ver}" "${suffix}" "${mariadb_ver}" "${suffix}"
}
